<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDm91LFXiKe8L2Jh8mjPCXLWz2_tn_U4Io",
  authDomain: "efegarage-d77a0.firebaseapp.com",
  projectId: "efegarage-d77a0",
  storageBucket: "efegarage-d77a0.firebasestorage.app",
  messagingSenderId: "638168658012",
  appId: "1:638168658012:web:ef8b35fdb44f728d08b699",
  measurementId: "G-BF1PGBX83F"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const cloudDoc = doc(db, "garageData", "main");
let cloudReady = false, cloudSaving = false, cloudSaveQueued = false, cloudUser = null;

// ================================================================
// SABİTLER & VERİ
// ================================================================
const TIP={sedan:"Sedan / Hatchback",suv:"SUV / Jip",ticari:"Ticari / Minibüs"};
const KAT=["Malzeme","Kira","Fatura","Maaş / Prim","Bakım","Diğer"];
const DEF_H=[{id:"h1",ad:"Dış Yıkama",p:{sedan:200,suv:250,ticari:300}},{id:"h2",ad:"İç Temizlik",p:{sedan:250,suv:300,ticari:350}},{id:"h3",ad:"Motor Yıkama",p:{sedan:150,suv:200,ticari:200}},{id:"h4",ad:"Cila / Pasta",p:{sedan:800,suv:1000,ticari:1200}},{id:"h5",ad:"Detaylı Temizlik",p:{sedan:1200,suv:1500,ticari:1800}}];
const DEF_K=[{id:"k1",ad:"Şampuan",miktar:20,min:5,birim:"lt"},{id:"k2",ad:"Cila",miktar:8,min:2,birim:"kg"},{id:"k3",ad:"Mikrofiber Bez",miktar:30,min:10,birim:"adet"}];
const TITLES={panel:"Yönetim Paneli",arac:"Araç Takibi",rand:"Randevular",mus:"Müşteri & Veresiye",wa:"WhatsApp Merkezi",per:"Personel & Prim",stok:"Akıllı Stok",fiyat:"Hizmet & Fiyatlar",muh:"Kasa & Muhasebe",rapor:"Raporlar & Analiz",log:"İşlem Geçmişi",kul:"Kullanıcılar & Yetki",ayar:"Ayarlar & Yedek"};
const ROLES={"Yönetici":null,"Personel":["arac","rand","mus","wa","stok"]};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let H=ld("ko_h",DEF_H),J=ld("ko_j",[]),G=ld("ko_g",[]),P=ld("ko_p",[]),K=ld("ko_k",DEF_K),R=ld("ko_r",[]);
let LOG=ld("ko_log",[]),USERS=ld("ko_users",[{id:"u1",ad:"Yönetici",rol:"Yönetici"}]),CURUSER=ld("ko_curuser","u1"),KP=ld("ko_kp",[]);
H=H.map(h=>({...h,stok:h.stok||[]}));
// Personel primi: araç tipine göre sabit tutar. Eski (yüzde) kayıtlar 0'a döner, Personel sayfasından yeniden girilir.
P=P.map(p=>({id:p.id||uid(),ad:p.ad||"Personel",prim:{sedan:Number(p.prim?.sedan??0)||0,suv:Number(p.prim?.suv??0)||0,ticari:Number(p.prim?.ticari??0)||0}}));
let S={ad:"EFE GARAGE",tel:"",adres:"",loy:10,ind:50,hedef:3000,acilis:8,kapanis:20,kap:2,slot:60,...ld("ko_s",{})};
if(S.ad==="Kanki Oto Yıkama")S.ad="EFE GARAGE";
J=J.map(j=>j.durum==="odendi"?{...j,durum:"teslim",tahsil:j.odemeTarih||j.tarih}:j);
let page="panel",donem="ay",q="",mqv="",editingId=null;
const saveAll=()=>{
  sv("ko_h",H);sv("ko_j",J);sv("ko_g",G);sv("ko_p",P);sv("ko_k",K);sv("ko_r",R);sv("ko_s",S);sv("ko_log",LOG);sv("ko_users",USERS);sv("ko_curuser",CURUSER);sv("ko_kp",KP);
  if(cloudReady && auth.currentUser) syncCloud();
};
async function syncCloud(){
  if(!cloudReady || !auth.currentUser)return;
  if(cloudSaving){cloudSaveQueued=true;return;}
  cloudSaving=true;
  try{
    const payload=JSON.parse(JSON.stringify({H,J,G,P,K,R,S,LOG,KP}));
    payload.updatedAt=serverTimestamp();
    payload.updatedBy=auth.currentUser.uid;
    await setDoc(cloudDoc,payload);
  }catch(e){console.error("Firebase kayıt hatası:",e);if(typeof toast==="function")toast("Buluta kaydedilemedi. Bağlantı/güvenlik ayarını kontrol edin.");}
  finally{cloudSaving=false;if(cloudSaveQueued){cloudSaveQueued=false;syncCloud();}}
}
async function loadCloudData(){
  cloudReady=false;
  try{
    const snap=await getDoc(cloudDoc);
    if(snap.exists()){
      const d=snap.data();
      H=Array.isArray(d.H)?d.H.map(h=>({...h,stok:h.stok||[]})):H;
      J=Array.isArray(d.J)?d.J.map(j=>j.durum==="odendi"?{...j,durum:"teslim",tahsil:j.odemeTarih||j.tarih}:j):J;
      G=Array.isArray(d.G)?d.G:G; P=Array.isArray(d.P)?d.P:P; K=Array.isArray(d.K)?d.K:K; R=Array.isArray(d.R)?d.R:R;
      S={...S,...(d.S||{})}; LOG=Array.isArray(d.LOG)?d.LOG:LOG; KP=Array.isArray(d.KP)?d.KP:KP;
      H=H.map(h=>({...h,stok:h.stok||[]}));
      J=J.map(j=>j.durum==="odendi"?{...j,durum:"teslim",tahsil:j.odemeTarih||j.tarih}:j);
      ["ko_h","ko_j","ko_g","ko_p","ko_k","ko_r","ko_s","ko_log","ko_kp"].forEach(k=>{});
      sv("ko_h",H);sv("ko_j",J);sv("ko_g",G);sv("ko_p",P);sv("ko_k",K);sv("ko_r",R);sv("ko_s",S);sv("ko_log",LOG);sv("ko_kp",KP);
    }else{
      // İlk oturum açan cihazdaki mevcut kayıtları bir defa buluta aktar.
      cloudReady=true;
      await syncCloud();
    }
    cloudReady=true;
  }catch(e){
    console.error("Firebase veri okuma hatası:",e);
    throw e;
  }
}

function area(v,lab){const W=470,Hh=190,pb=28,mx=Math.max(...v,1),n=v.length,sx=(W-30)/(n-1);const p=v.map((x,i)=>[15+i*sx,Hh-pb-(x/mx)*(Hh-pb-26)]);
  const d=p.map((a,i)=>(i?"L":"M")+a[0].toFixed(1)+" "+a[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc107" stop-opacity=".4"/><stop offset="1" stop-color="#ffc107" stop-opacity="0"/></linearGradient></defs>
  <path d="${d} L${p[n-1][0]} ${Hh-pb} L${p[0][0]} ${Hh-pb}Z" fill="url(#gr)"/><path d="${d}" fill="none" stroke="#ffc107" stroke-width="2.5" stroke-linejoin="round"/>
  ${p.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#09090a" stroke="#ffc107" stroke-width="2"/>${v[i]?`<text x="${a[0]}" y="${a[1]-10}" text-anchor="middle" fill="#f4f4f5" font-size="10.5" font-weight="600">${Math.round(v[i])}</text>`:""}<text x="${a[0]}" y="${Hh-8}" text-anchor="middle" fill="#8e8e93" font-size="11">${lab[i]}</text>`).join("")}</svg>`}
function donut(parts,center){const t=sum(parts,x=>x.v),R=46,C=2*Math.PI*R;let a=0;
  return `<svg viewBox="0 0 120 120" width="130" height="130"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#222" stroke-width="15"/>${t?parts.map(p=>{const l=p.v/t*C,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.c}" stroke-width="15" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=l;return s}).join(""):""}<text x="60" y="64" text-anchor="middle" fill="#f4f4f5" font-size="13" font-weight="800">${center}</text></svg>`}
function ring(p,txt){const R=52,C=2*Math.PI*R;return `<svg viewBox="0 0 130 130" width="120" height="120"><circle cx="65" cy="65" r="${R}" fill="none" stroke="#2a2204" stroke-width="12"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="#ffc107" stroke-width="12" stroke-linecap="round" stroke-dasharray="${p*C} ${C}" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" fill="#ffc107" font-size="24" font-weight="800">${txt}</text><text x="65" y="80" text-anchor="middle" fill="#8e8e93" font-size="10">GÜNLÜK HEDEF</text></svg>`}

  else if(d.sk){const k=K.find(x=>x.id===d.sk);k.miktar=Math.max(0,+(k.miktar+ +d.dl).toFixed(2));saveAll();render()}
  else if(d.sd){if(!isAdmin())return toast("Silme yetkiniz yok");if(confirm("Stok kalemi silinsin mi?")){K=K.filter(x=>x.id!==d.sd);saveAll();render()}}
  else if(d.pd){if(confirm("Personel silinsin mi?")){P=P.filter(x=>x.id!==d.pd);saveAll();render()}}
  else if(d.hd){if(confirm("Hizmet silinsin mi?")){H=H.filter(x=>x.id!==d.hd);saveAll();render()}}

function musteriler(){const m={};J.filter(j=>!j.eski).reverse().forEach(j=>{const x=m[j.plaka]||(m[j.plaka]={plaka:j.plaka,ad:"",tel:"",musteriTuru:"bireysel",n:0,top:0,borc:0,son:j.tarih});
  x.n++;x.son=j.tarih;if(j.musteri)x.ad=j.musteri;if(j.musteriTuru)x.musteriTuru=j.musteriTuru;if(j.tel)x.tel=j.tel;if(j.tahsil)x.top+=j.tutar;if(j.durum==="teslim"&&j.odeme==="Veresiye"&&!j.tahsil)x.borc+=j.tutar});
  return Object.values(m).sort((a,b)=>b.n-a.n)}
function customerStats(){return musteriler().map(m=>{const hist=J.filter(j=>j.plaka===m.plaka);return {...m,hist,last:hist.slice().sort((a,b)=>b.tarih.localeCompare(a.tarih))[0]}})}
const customerByPlate=p=>musteriler().find(x=>x.plaka===String(p||"").toUpperCase());
const indirim=p=>{const n=J.filter(j=>j.plaka===p).length;return n>0&&S.loy>0&&n%S.loy===0?S.ind:0};

function gunSonu(){const b=bugun(),od=odenen().filter(j=>ymd(gel(j))===b),tn=sum(od.filter(j=>j.odeme==="Nakit"),j=>j.tutar),tk=sum(od.filter(j=>j.odeme==="Kart"),j=>j.tutar),tv=sum(J.filter(j=>j.odeme==="Veresiye"&&!j.tahsil&&ymd(j.teslim||j.tarih)===b),j=>j.tutar),gd=sum(G.filter(g=>ymd(g.tarih)===b),g=>g.tutar),bek=tn-gd;

function rMuh(){const gl=odenen().filter(j=>inD(gel(j))),gd=G.filter(g=>inD(g.tarih)),gt=sum(gl,j=>j.tutar),dt=sum(gd,g=>g.tutar),nk=sum(gl.filter(j=>j.odeme==="Nakit"),j=>j.tutar);
  const vrP=veresiye().filter(j=>inD(j.teslim||j.tarih));

  const h=[...gl.map(j=>({t:gel(j),a:j.eski?"📥 Geçmiş kayıt – "+(j.musteri||""):j.plaka+" – "+j.kalemler.map(k=>k.ad).join(", "),eid:j.eski?j.id:null,g:1,v:j.tutar,o:j.odeme+(j.ver?" · veresiye tahsilatı":"")})),

  const kpi=(l,v,c="")=>`<div class="c3"><div class="card kpi"><div class="l">${l}</div><div class="v ${c}">${v}</div></div></div>`;
  $("#view").innerHTML=`<div class="fx mb"><select id="dn" class="fc" style="width:auto">${[["bugun","Bugün"],["hafta","Son 7 gün"],["ay","Bu ay"],["hepsi","Tümü"]].map(([v,t])=>`<option value="${v}" ${v===donem?"selected":""}>${t}</option>`).join("")}</select></div>
  <div class="row">${kpi("Gelir ("+adet(gl)+" araç)",tl(gt),"y")}${kpi("Gider",tl(dt),"no")}${kpi("Net Kâr",tl(gt-dt),gt-dt>=0?"ok":"no")}${kpi("Veresiye Alacak (gelir/gider değil)",tl(sum(vrP,j=>j.tutar)),"bl")}
  <div class="c12"><div class="card sm mu">Nakit <b style="color:var(--tx)">${tl(nk)}</b> · Kart <b style="color:var(--tx)">${tl(gt-nk)}</b> · Kâr marjı <b class="y">${gt?Math.round((gt-dt)/gt*100):0}%</b> · Gelir yalnızca tahsil edilen paradır; tahsil edilmemiş veresiye ayrı gösterilir.</div></div></div>
  ${gunSonu()}${kapanisGecmis()}${eskiKart()}<div class="row"><div class="c4"><div class="card"><h5>Gider Ekle</h5><label class="l">Kategori</label><select id="gk" class="fc mb">${KAT.map(k=>`<option>${k}</option>`).join("")}</select><label class="l">Açıklama</label><input id="ga" class="fc mb" placeholder="Şampuan, elektrik…"><label class="l">Tutar (₺)</label><input id="gt" type="number" min="0" class="fc mb"><label class="l">Tarih</label><input id="gdt" type="date" class="fc mb" value="${bugun()}"><button class="btn p" id="ge">Gideri Kaydet</button>

  $("#ge").onclick=()=>{const a=$("#ga").value.trim(),t=+$("#gt").value;if(!a||!(t>0))return toast("Açıklama ve tutar girin");G.unshift({id:uid(),ad:a,kat:$("#gk").value,tutar:t,tarih:$("#gdt").value?new Date($("#gdt").value+"T12:00").toISOString():new Date().toISOString()});saveAll();logAct("Gider eklendi",`${a} · ${t} TL`);toast("Gider eklendi");rMuh()}}

// ================================================================
// RAPORLAR & GEÇMİŞ & KULLANICILAR
// ================================================================
// ---- Gün sonu kapanış kaydı & aylık rapor ----
// ---- Geçmiş kayıt & toplu içe aktarma ----
const adet=a=>sum(a,j=>j.eski?(+j.adet||0):1);
function pTarih(s){s=String(s||"").trim();let r=null,m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)r=[+m[1],+m[2],+m[3]];else if(m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/))r=[+m[3],+m[2],+m[1]];if(!r)return null;const d=new Date(r[0],r[1]-1,r[2]);if(d.getFullYear()!==r[0]||d.getMonth()!==r[1]-1||d.getDate()!==r[2])return null;return `${r[0]}-${String(r[1]).padStart(2,"0")}-${String(r[2]).padStart(2,"0")}`}
function pSayi(s){s=String(s||"").replace(/[₺\s]|TL/gi,"");if(!s)return NaN;if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");else if(s.includes(","))s=s.replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");return parseFloat(s)}
function eskiGelirEkle(g,tutar,odeme,ad,not){const d=new Date(g+"T12:00").toISOString();J.push({id:uid(),plaka:"GEÇMİŞ",musteri:not||"Geçmiş kayıt",tip:"sedan",kalemler:[{ad:"Geçmiş Kayıt",fiyat:tutar}],ara:tutar,indirim:0,tutar,durum:"teslim",odeme,tahsil:d,teslim:d,tarih:d,eski:true,adet:+ad||0,stokDusuldu:true})}
function eskiParse(txt){const ok=[],err=[];txt.split(/\r?\n/).forEach((ln,i)=>{ln=ln.trim();if(!ln||/^tarih/i.test(ln))return;const c=ln.split(/[;\t]/).map(x=>x.trim()),t=pTarih(c[0]),tur=(c[1]||"").toLowerCase(),tutar=pSayi(c[3]);
  if(!t)return err.push(`Satır ${i+1}: tarih okunamadı (${c[0]||"boş"})`);
  if(tur!=="gelir"&&tur!=="gider")return err.push(`Satır ${i+1}: tür "gelir" veya "gider" olmalı`);
  if(!(tutar>0))return err.push(`Satır ${i+1}: tutar okunamadı (${c[3]||"boş"})`);
  if(tur==="gelir")ok.push({tur,t,ad:c[2]||"Geçmiş kayıt",tutar,od:/kart/i.test(c[4]||"")?"Kart":"Nakit",adet:+c[5]||0});
  else ok.push({tur,t,ad:c[2]||"Gider",tutar,kat:KAT.find(k=>k.toLowerCase()===(c[4]||"").toLowerCase())||"Diğer"})});return{ok,err}}
function eskiKart(){return `<details class="card" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:700">📥 Geçmiş Kayıt Ekle / Toplu İçe Aktar <span class="mu sm">— eski gelir-giderleri girin</span></summary>
  <div class="row mt"><div class="c5"><h5>Tek Gelir Kaydı</h5><div class="row"><div class="c6"><label class="l">Tarih</label><input id="egt" type="date" class="fc"></div><div class="c6"><label class="l">Tutar (₺)</label><input id="egtu" class="fc" placeholder="3.500"></div><div class="c6"><label class="l">Ödeme</label><select id="ego" class="fc"><option>Nakit</option><option>Kart</option></select></div><div class="c6"><label class="l">Araç adedi (ops.)</label><input id="ega" type="number" min="0" class="fc"></div></div><label class="l mt">Not</label><input id="egn" class="fc mb" placeholder="Örn. Ocak günlük ciro"><button class="btn p" id="egekle">＋ Geçmiş Geliri Ekle</button><p class="mu sm mt">Geçmiş gider için: aşağıdaki <b>Gider Ekle</b> formunda tarihi değiştirin.</p></div>
  <div class="c7"><h5>Toplu İçe Aktar (Excel'den yapıştır)</h5><textarea id="etx" class="fc" rows="7" style="font-family:ui-monospace,monospace;font-size:12.5px" placeholder="2026-01-15;gelir;Günlük ciro;3500;nakit;12&#10;15.01.2026;gider;Kira;15000;Kira"></textarea><div class="mu sm mt">Her satır: <b>tarih ; tür ; açıklama ; tutar ; ödeme veya kategori ; araç adedi</b>. Tür <b>gelir</b> / <b>gider</b>. Excel'den kopyaladığınız sütunlar (sekmeli) de çalışır. Tarih: 2026-01-15 veya 15.01.2026.</div><div class="fx g2 mt fw"><button class="btn p" id="etoplu">İçe Aktar</button><button class="btn" id="eorn">Örnek Yükle</button></div><div id="erap" class="no sm mt"></div></div></div></details>`}
function eskiBind(){
  $("#egekle").onclick=()=>{const g=$("#egt").value,t=pSayi($("#egtu").value);if(!g||!(t>0))return toast("Tarih ve tutar girin");eskiGelirEkle(g,t,$("#ego").value,$("#ega").value,$("#egn").value.trim());saveAll();logAct("Geçmiş gelir eklendi",`${g} · ${t} TL`);toast("Geçmiş gelir eklendi ✓");rMuh()};
  $("#eorn").onclick=()=>{$("#etx").value="2026-01-15;gelir;Günlük ciro;3500;nakit;12\n2026-01-15;gelir;Günlük ciro (POS);2200;kart;8\n15.01.2026;gider;Kira;15000;Kira\n16.01.2026;gider;Şampuan;1250,50;Malzeme"};
  $("#etoplu").onclick=()=>{const r=eskiParse($("#etx").value);if(!r.ok.length&&!r.err.length)return toast("Önce metni yapıştırın");
    if(r.err.length){$("#erap").innerHTML="Hiçbir kayıt eklenmedi, şu satırları düzeltin:<br>"+r.err.slice(0,8).map(esc).join("<br>")+(r.err.length>8?`<br>… +${r.err.length-8} hata daha`:"");return}
    const gel_=r.ok.filter(x=>x.tur==="gelir"),gid=r.ok.filter(x=>x.tur==="gider");
    if(!confirm(`${gel_.length} gelir (${tl(sum(gel_,x=>x.tutar))}) ve ${gid.length} gider (${tl(sum(gid,x=>x.tutar))}) eklenecek. Onaylıyor musunuz?`))return;
    gel_.forEach(x=>eskiGelirEkle(x.t,x.tutar,x.od,x.adet,x.ad));gid.forEach(x=>G.push({id:uid(),ad:x.ad,kat:x.kat,tutar:x.tutar,tarih:new Date(x.t+"T12:00").toISOString()}));
    saveAll();logAct("Toplu içe aktarma",`${gel_.length} gelir, ${gid.length} gider`);toast("İçe aktarıldı ✓");rMuh()}}
function gunVeri(b){const od=odenen().filter(j=>ymd(gel(j))===b);return{tn:sum(od.filter(j=>j.odeme==="Nakit"),j=>j.tutar),tk:sum(od.filter(j=>j.odeme==="Kart"),j=>j.tutar),tv:sum(J.filter(j=>j.odeme==="Veresiye"&&!j.tahsil&&ymd(j.teslim||j.tarih)===b),j=>j.tutar),gd:sum(G.filter(g=>ymd(g.tarih)===b),g=>g.tutar),get bek(){return this.tn-this.gd}}}
function kapanisKaydet(){const b=bugun(),v=gunVeri(b),s=$("#say").value;
  if(s==="")return toast("Önce sayılan nakdi girin");
  if(KP.some(x=>x.gun===b)&&!confirm("Bugün için kapanış zaten kayıtlı. Üzerine yazılsın mı?"))return;
  KP=KP.filter(x=>x.gun!==b);
  KP.unshift({id:uid(),gun:b,t:new Date().toISOString(),u:me().ad,nakit:v.tn,kart:v.tk,ver:v.tv,gider:v.gd,beklenen:v.bek,sayilan:+s,fark:+s-v.bek,not:$("#knot").value.trim()});
  saveAll();logAct("Gün kapatıldı",`${b} · fark ${+s-v.bek} TL`);toast("Gün kapatıldı ✓");rMuh()}
function kapanisGecmis(){
  const l=KP.slice().sort((a,b)=>b.gun.localeCompare(a.gun)).slice(0,31),top=sum(l,x=>x.fark),bug=KP.find(x=>x.gun===bugun());
  const fc=f=>f===0?"ok":f>0?"y":"no",fm=f=>(f>0?"+":f<0?"−":"")+tl(Math.abs(f));
  return `<div class="card" style="margin:14px 0"><div class="fx jb ac fw g2 mb"><h5 style="margin:0">Kapanış Geçmişi</h5><span class="sm mu">${l.length} gün · toplam fark <b class="${fc(top)}">${fm(top)}</b>${bug?' · <span class="ok">Bugün kapatıldı ✓</span>':""}</span></div><div class="tw"><table class="tb"><thead><tr><th>Gün</th><th>Nakit</th><th>Kart</th><th>Veresiye</th><th>Gider</th><th>Olması gereken</th><th>Sayılan</th><th>Fark</th><th>Kapatan</th><th>Not</th></tr></thead><tbody>${l.map(x=>`<tr><td class="b">${new Date(x.gun+"T12:00").toLocaleDateString("tr-TR",{day:"2-digit",month:"short",weekday:"short"})}</td><td>${tl(x.nakit)}</td><td>${tl(x.kart)}</td><td class="bl">${tl(x.ver)}</td><td class="no">${tl(x.gider)}</td><td>${tl(x.beklenen)}</td><td class="b">${tl(x.sayilan)}</td><td class="b ${fc(x.fark)}">${x.fark===0?"✓ Tutuyor":fm(x.fark)}</td><td class="sm">${esc(x.u)}</td><td class="sm mu">${esc(x.not)}</td></tr>`).join("")||'<tr><td colspan="10" class="mu">Henüz kapanış kaydı yok. Sayılan nakdi girip "Günü Kapat & Kaydet" ile kaydedin.</td></tr>'}</tbody></table></div></div>`}
let rapAy=bugun().slice(0,7);
function aylikVeri(ay){
  const inM=t=>ymd(t).slice(0,7)===ay,gl=odenen().filter(j=>inM(gel(j))),gd=G.filter(g=>inM(g.tarih));
  const gelir=sum(gl,j=>j.tutar),nakit=sum(gl.filter(j=>j.odeme==="Nakit"),j=>j.tutar),gider=sum(gd,g=>g.tutar);
  const kat={};gd.forEach(g=>kat[g.kat||"Diğer"]=(kat[g.kat||"Diğer"]||0)+g.tutar);
  const hiz={};gl.forEach(j=>(j.kalemler||[]).forEach(k=>hiz[k.ad]=(hiz[k.ad]||0)+k.fiyat));
  const per=P.map(p=>{const x=gl.filter(j=>j.pid===p.id);return{ad:p.ad,n:x.length,prim:sum(x,primTutar)}}).filter(x=>x.n);
  const kp=KP.filter(x=>x.gun.slice(0,7)===ay);
  return{ay,n:adet(gl),gelir,nakit,kart:gelir-nakit,gider,net:gelir-gider,kat,hiz,per,
    vYaz:sum(J.filter(j=>j.ver&&inM(j.teslim||j.tarih)),j=>j.tutar),vTah:sum(gl.filter(j=>j.ver),j=>j.tutar),vAcik:sum(veresiye(),j=>j.tutar),
    kapGun:kp.length,kapFark:sum(kp,x=>x.fark),gun:new Set(gl.map(j=>ymd(gel(j)))).size}}
function aylikMetin(d){
  const ad=new Date(d.ay+"-01T12:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"}),L=[];
  L.push(`${S.ad} — ${ad} Aylık Kapanış Raporu`,`Hazırlayan: ${me().ad} · ${new Date().toLocaleDateString("tr-TR")}`,"",
    "GELİR",`Toplam tahsilat: ${tl(d.gelir)}`,`  Nakit: ${tl(d.nakit)} · Kart: ${tl(d.kart)}`,`Yıkanan araç: ${d.n} · Çalışılan gün: ${d.gun}`,`Ortalama sepet: ${d.n?tl(d.gelir/d.n):"-"}`,"",
    "GİDER",`Toplam gider: ${tl(d.gider)}`,...Object.entries(d.kat).map(([k,v])=>`  - ${k}: ${tl(v)}`),"",
    `NET KÂR: ${tl(d.net)}${d.gelir?` (marj %${Math.round(d.net/d.gelir*100)})`:""}`,"",
    "VERESİYE",`Bu ay veresiyeye yazılan: ${tl(d.vYaz)}`,`Bu ay tahsil edilen veresiye: ${tl(d.vTah)}`,`Şu an açık toplam alacak: ${tl(d.vAcik)}`,"",
    "HİZMET GELİRLERİ",...(Object.entries(d.hiz).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`  - ${k}: ${tl(v)}`)),"",
    "PERSONEL PRİMLERİ",...(d.per.length?d.per.map(x=>`  - ${x.ad}: ${x.n} araç · prim ${tl(x.prim)}`):["  (kayıt yok)"]),"",
    "KASA KAPANIŞLARI",`Kapatılan gün: ${d.kapGun} · Toplam kasa farkı: ${d.kapFark===0?"0 ₺":(d.kapFark>0?"+":"−")+tl(Math.abs(d.kapFark))}`);
  return L.join("\n")}
function aylikKart(){
  const d=aylikVeri(rapAy),k=(l,v,c="")=>`<div class="c3"><div class="kpi"><div class="l">${l}</div><div class="v ${c}">${v}</div></div></div>`;
  return `<div class="card" style="margin-bottom:14px"><div class="fx jb ac fw g2 mb"><h5 style="margin:0">Aylık Kapanış Raporu</h5><input id="rapay" type="month" class="fc" style="width:auto" value="${rapAy}"></div>
  <div class="row mb">${k("Tahsilat",tl(d.gelir),"y")}${k("Gider",tl(d.gider),"no")}${k("Net Kâr",tl(d.net),d.net>=0?"ok":"no")}${k("Açık Veresiye",tl(d.vAcik),"bl")}</div>
  <textarea id="rtext" class="fc" rows="14" readonly style="font-family:ui-monospace,monospace;font-size:12.5px">${esc(aylikMetin(d))}</textarea>
  <div class="fx g2 mt fw"><button class="btn p" id="rcopy">📋 Metni Kopyala</button><a class="btn g" id="rwa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(aylikMetin(d))}">💬 WhatsApp ile Paylaş</a></div></div>`}
function rRapor(){rRaporEski();$("#view").insertAdjacentHTML("afterbegin",aylikKart());
  $("#rapay").onchange=e=>{if(e.target.value){rapAy=e.target.value;rRapor()}};
  $("#rcopy").onclick=async()=>{const t=$("#rtext");try{await navigator.clipboard.writeText(t.value);toast("Kopyalandı ✓")}catch(e){t.select();try{document.execCommand("copy");toast("Kopyalandı ✓")}catch(x){toast("Metni seçip kopyalayın")}}}}
function rRaporEski(){
  const month=odenen().filter(j=>ymd(gel(j)).slice(0,7)===bugun().slice(0,7)),service={};month.forEach(j=>(j.kalemler||[]).forEach(k=>service[k.ad]=(service[k.ad]||0)+k.fiyat));
  const staff=P.map(p=>{const x=month.filter(j=>j.pid===p.id);return {p,x,prim:sum(x,j=>primTutar(j))}}).sort((a,b)=>b.x.length-a.x.length),customers=customerStats().sort((a,b)=>b.top-a.top).slice(0,10),gAy=sum(G.filter(g=>ymd(g.tarih).slice(0,7)===bugun().slice(0,7)),g=>g.tutar);
  $("#view").innerHTML=`<div class="row"><div class="c4"><div class="card"><h5>Bu Ay Hizmet Performansı</h5>${Object.entries(service).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="mb"><div class="fx jb sm"><span>${esc(n)}</span><b class="y">${tl(v)}</b></div><div class="bar"><i style="width:${v/Math.max(...Object.values(service),1)*100}%"></i></div></div>`).join("")||'<div class="mu">Henüz veri yok.</div>'}</div></div>
  <div class="c4"><div class="card"><h5>Personel Sıralaması</h5>${staff.map((x,i)=>`<div class="fx jb ac mb"><span>${i+1}. <b>${esc(x.p.ad)}</b><div class="mu sm">${x.x.length} araç</div></span><b class="y">${tl(x.prim)}</b></div>`).join("")||'<div class="mu">Personel yok.</div>'}</div></div>
  <div class="c4"><div class="card"><h5>En Değerli Müşteriler</h5>${customers.map((m,i)=>`<div class="fx jb ac mb"><span>${i+1}. <b>${esc(m.ad||m.plaka)}</b><div class="mu sm">${m.n} ziyaret</div></span><b class="y">${tl(m.top)}</b></div>`).join("")||'<div class="mu">Müşteri yok.</div>'}</div></div></div>
  <div class="card mt"><h5>Finansal Özet — Bu Ay</h5><div class="row"><div class="c3"><div class="kpi"><div class="l">Ciro (tahsil)</div><div class="v y">${tl(sum(month,j=>j.tutar))}</div></div></div><div class="c3"><div class="kpi"><div class="l">Gider</div><div class="v no">${tl(gAy)}</div></div></div><div class="c3"><div class="kpi"><div class="l">Araç</div><div class="v">${adet(month)}</div></div></div><div class="c3"><div class="kpi"><div class="l">Ortalama Sepet</div><div class="v">${month.length?money(sum(month,j=>j.tutar)/month.length):money(0)}</div></div></div></div></div>`}
function rLog(){const rows=LOG.slice(0,250);$("#view").innerHTML=`<div class="card"><div class="fx jb ac mb"><div><h5 style="margin-bottom:3px">İşlem Geçmişi</h5><div class="mu sm">Kim, ne zaman, ne yaptı?</div></div><button class="btn d s" id="logclear">Temizle</button></div><div class="tw"><table class="tb"><thead><tr><th>Tarih</th><th>Kullanıcı</th><th>İşlem</th><th>Detay</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="sm">${new Date(x.t).toLocaleString("tr-TR")}</td><td class="b">${esc(x.u)}</td><td><span class="badge m">${esc(x.action)}</span></td><td>${esc(x.detail)}</td></tr>`).join("")||'<tr><td colspan="4" class="mu">Henüz işlem kaydı yok.</td></tr>'}</tbody></table></div></div>`;$("#logclear").onclick=()=>{if(confirm("İşlem geçmişi silinsin mi?")){LOG=[];saveAll();render()}}}
function rKul(){
  $("#view").innerHTML=`<div class="row"><div class="c4"><div class="card"><h5>Kullanıcı Ekle</h5><label class="l">Ad</label><input id="ua" class="fc mb" placeholder="Örn. Mehmet"><label class="l">Rol</label><select id="ur" class="fc mb">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join("")}</select><label class="l">Şifre (en az 4 karakter)</label><input id="up" type="password" class="fc mb" autocomplete="new-password"><button class="btn p" id="ue">＋ Kullanıcı Ekle</button>
  <div class="hint mt"><b>Personel</b> rolü: araç takibi, randevu, müşteri/veresiye, WhatsApp ve stok ekranlarını kullanır; muhasebe, rapor, fiyat, ayar ve kullanıcıları göremez, kayıt silemez.</div>
  <div class="hint info mt">Not: Veriler Firebase Firestore ile ortak kullanılır. Erişim Firebase Authentication hesabı gerektirir; personel hesaplarını Firebase Console üzerinden ekleyin.</div></div></div>
  <div class="c8"><div class="card"><h5>Kullanıcılar</h5>${USERS.map(u=>`<div class="kc"><div class="fx jb ac fw g2"><div><b>👤 ${esc(u.ad)}</b> <span class="badge ${u.rol==="Yönetici"?"k":"w"}">${esc(u.rol)}</span>${u.id===CURUSER?' <span class="badge o">Aktif</span>':""}${u.ph?"":' <span class="badge rd">Şifre yok</span>'}</div>${u.id!=="u1"&&u.id!==CURUSER?`<button class="btn d s" data-ud="${u.id}">Sil</button>`:""}</div><div class="fx g2 mt"><input class="fc" type="password" placeholder="Yeni şifre" data-pw="${u.id}" autocomplete="new-password"><button class="btn s p" data-pws="${u.id}">Şifreyi Kaydet</button></div></div>`).join("")}</div></div></div>`;
  $("#ue").onclick=async()=>{const ad=$("#ua").value.trim(),pw=$("#up").value;if(!ad)return toast("Ad girin");if(pw.length<4)return toast("Şifre en az 4 karakter");USERS.push({id:uid(),ad,rol:$("#ur").value,ph:await hs(pw)});saveAll();logAct("Kullanıcı eklendi",ad);render()};
  document.querySelectorAll("[data-pws]").forEach(b=>b.onclick=async()=>{const v=document.querySelector(`[data-pw="${b.dataset.pws}"]`).value;if(v.length<4)return toast("Şifre en az 4 karakter");const u=USERS.find(x=>x.id===b.dataset.pws);u.ph=await hs(v);saveAll();logAct("Şifre güncellendi",u.ad);toast("Şifre güncellendi ✓");render()})}

function rAyar(){
  $("#view").innerHTML=`<div class="row"><div class="c6"><div class="card"><h5>İşletme & Sadakat</h5>
  <label class="l">İşletme Adı</label><input id="sa" class="fc mb" value="${esc(S.ad)}"><label class="l">Telefon</label><input id="st" class="fc mb" value="${esc(S.tel)}"><label class="l">Adres</label><input id="sd" class="fc mb" value="${esc(S.adres)}">
  <div class="row"><div class="c4"><label class="l">Her kaçıncı yıkama</label><input id="sl" type="number" min="0" class="fc" value="${S.loy}"></div><div class="c4"><label class="l">İndirim %</label><input id="si" type="number" min="0" max="100" class="fc" value="${S.ind}"></div><div class="c4"><label class="l">Günlük hedef ₺</label><input id="sh" type="number" min="0" class="fc" value="${S.hedef}"></div></div>
  <div class="row mt"><div class="c3"><label class="l">Açılış saati</label><input id="sac" type="number" min="0" max="23" class="fc" value="${S.acilis}"></div><div class="c3"><label class="l">Kapanış saati</label><input id="skp" type="number" min="1" max="24" class="fc" value="${S.kapanis}"></div><div class="c3"><label class="l">Aynı anda araç</label><input id="skap" type="number" min="1" class="fc" value="${S.kap}"></div><div class="c3"><label class="l">Randevu aralığı</label><select id="ssl" class="fc"><option value="30" ${S.slot==30?"selected":""}>30 dk</option><option value="60" ${S.slot==60?"selected":""}>60 dk</option><option value="90" ${S.slot==90?"selected":""}>90 dk</option></select></div></div><button class="btn p mt" id="ssv">Kaydet</button></div></div>
  <div class="c6"><div class="card"><h5>Yedekleme</h5><p class="mu sm">Veriler Firebase Firestore ile bulutta tutulur ve bu cihazda da önbelleklenir. Yedek metni ayrıca dışa aktarılabilir.</p>
  <textarea id="yd" class="fc" rows="6" placeholder="Yedek metni burada görünür / geri yüklemek için yapıştırın"></textarea>
  <div class="fx g2 mt fw"><button class="btn p" id="ya">Yedek Oluştur</button><button class="btn" id="yg">Geri Yükle</button><button class="btn d" id="ys">Tüm Veriyi Sil</button></div></div></div></div>`;
  $("#ssv").onclick=()=>{S={...S,ad:$("#sa").value.trim()||"EFE GARAGE",tel:$("#st").value,adres:$("#sd").value,loy:+$("#sl").value||0,ind:Math.min(100,+$("#si").value||0),hedef:+$("#sh").value||0,acilis:+$("#sac").value,kapanis:+$("#skp").value||20,kap:Math.max(1,+$("#skap").value||1),slot:+$("#ssl").value||60};saveAll();logAct("Ayarlar güncellendi");toast("Kaydedildi ✓");render()};
  $("#ya").onclick=()=>{$("#yd").value=JSON.stringify({H,J,G,P,K,R,S,LOG,USERS,KP});$("#yd").select();toast("Yedek hazır — kopyalayın")};
  $("#yg").onclick=()=>{try{const d=JSON.parse($("#yd").value);if(!Array.isArray(d.J)||!Array.isArray(d.H))throw 0;if(!confirm("Mevcut veriler yedekle değiştirilecek. Emin misiniz?"))return;H=d.H.map(h=>({...h,stok:h.stok||[]}));J=d.J.map(j=>j.durum==="odendi"?{...j,durum:"teslim",tahsil:j.odemeTarih||j.tarih}:j);G=d.G||[];P=d.P||[];K=d.K||[];R=d.R||[];S={...S,...d.S};LOG=d.LOG||[];KP=d.KP||[];if(Array.isArray(d.USERS)&&d.USERS.some(u=>u.ph)){USERS=d.USERS;if(!USERS.some(u=>u.id===CURUSER)){logout();return}}saveAll();toast("Geri yüklendi ✓");render()}catch(e){toast("Geçersiz yedek metni")}};
  $("#ys").onclick=()=>{if(confirm("TÜM kayıtlar silinecek (kullanıcılar kalır). Emin misiniz?")&&confirm("Bu işlem geri alınamaz!")){J=[];G=[];R=[];LOG=[];KP=[];saveAll();render()}}}

boot();
